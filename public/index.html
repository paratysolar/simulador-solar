<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Solar</title>
</head>
<body>
<script src="/page-a.js"></script>
<script src="/page-b.js"></script>
<script>
(function(){
  if (window.PAGE_A && window.PAGE_B) {
    document.open();
    document.write(window.PAGE_A + window.PAGE_B);
    document.close();
  } else {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">Carregando...</p>';
  }
})();
</script>
</body>
</html>
