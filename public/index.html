<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador Solar</title></head>
<body>
<script>
(async function(){
  const [a,b] = await Promise.all([
    fetch('/payload-a.b64').then(r=>r.text()),
    fetch('/payload-b.b64').then(r=>r.text())
  ]);
  const b64 = (a+b).trim();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  const text = await new Response(stream).text();
  document.open(); document.write(text); document.close();
})();
</script>
<noscript>Ative JavaScript.</noscript>
</body></html>
