<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Solar</title>
</head>
<body>
<script>
fetch('/sim-page.html').then(r=>r.text()).then(t=>{
  document.open();
  document.write(t);
  document.close();
}).catch(()=>{
  document.body.innerHTML='<p style="font-family:sans-serif;padding:2rem">Erro ao carregar simulador. <a href="/sim-page.html">Abrir direto</a></p>';
});
</script>
<noscript><a href="/sim-page.html">Abrir simulador</a></noscript>
</body>
</html>
